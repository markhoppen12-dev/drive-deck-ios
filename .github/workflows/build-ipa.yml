# Builds Drive Deck for iPhone on GitHub's Mac computers and produces DriveDeck.ipa.
# Put this file in your repository at:  .github/workflows/build-ipa.yml
# and upload drive-deck-ios.zip to the top of the same repository.
name: Build iPhone app

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Show what is in the repository
        run: find . -path ./.git -prune -o -type f -print | head -60

      - name: Find the app project
        shell: bash
        run: |
          set -e
          ZIP=$(find . -path ./.git -prune -o -type f -iname '*.zip' -print | head -1)
          if [ -n "$ZIP" ]; then
            echo "Using zip: $ZIP"
            unzip -q "$ZIP" -d unpacked
            SEARCH=unpacked
          else
            echo "No zip found, looking for unzipped project files"
            SEARCH=.
          fi
          SPEC=$(find "$SEARCH" -path ./.git -prune -o -path '*/__MACOSX' -prune -o -name project.yml -print | head -1)
          if [ -z "$SPEC" ]; then
            echo "::error::Could not find the Drive Deck project. Upload drive-deck-ios.zip to the repository (Add file > Upload files) and run this again."
            exit 1
          fi
          DIR=$(dirname "$SPEC")
          echo "Project found in: $DIR"
          mkdir src
          cp -R "$DIR/project.yml" "$DIR/DriveDeck" "$DIR/web" src/
          ls -R src | head -30

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create the Xcode project
        working-directory: src
        run: xcodegen generate

      - name: Build the app (unsigned)
        working-directory: src
        run: |
          xcodebuild -project DriveDeck.xcodeproj -target DriveDeck \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package DriveDeck.ipa
        working-directory: src
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/DriveDeck.app Payload/
          zip -qry ../DriveDeck.ipa Payload
          ls -la ../DriveDeck.ipa

      - name: Save DriveDeck.ipa for download
        uses: actions/upload-artifact@v4
        with:
          name: DriveDeck-ipa
          path: DriveDeck.ipa
          retention-days: 30
